[project]
name = "libre-devops-helpers"
version = "0.1.0"
description = "Libre DevOps Microsoft Helper: importable helpers and a fast, read-only CLI for Azure, Entra ID, Defender, Intune, Key Vault and Log Analytics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Craig Thacker" }]
requires-python = ">=3.11"
keywords = [
    "azure",
    "azure-cli",
    "entra-id",
    "defender-for-endpoint",
    "defender-xdr",
    "intune",
    "key-vault",
    "log-analytics",
    "microsoft-graph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
# Standard library first. Runtime dependencies are deliberately few; the Azure CLI
# itself is an external prerequisite, not a Python dependency.
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/libre-devops/python-helpers"
Issues = "https://github.com/libre-devops/python-helpers/issues"
Documentation = "https://libredevops.org"

[project.scripts]
ldo = "libre_devops_helpers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "rust-just>=1.30",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libre_devops_helpers"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
